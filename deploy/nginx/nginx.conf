pid /tmp/nginx.pid;
worker_processes auto;

events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;

    map $http_x_request_id $upstream_request_id {
        default $http_x_request_id;
        "" $request_id;
    }
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https https;
    }

    log_format safe_json escape=json '{"timestamp":"$time_iso8601","service":"nginx","event":"http.access",'
        '"request_id":"$upstream_request_id","method":"$request_method","uri":"$uri",'
        '"status":$status,"duration":$request_time,"upstream_duration":"$upstream_response_time"}';
    access_log /dev/stdout safe_json;
    error_log /dev/stderr warn;

    upstream django_backend { server backend:8000; keepalive 32; }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;
        client_max_body_size 12m;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options DENY always;

        location = /nginx-health { access_log off; return 200 "ok\n"; }
        location = /internal/metrics/ { access_log off; return 404; }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /media/ {
            access_log off;
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Request-ID $upstream_request_id;
        }

        location /_protected_media/ {
            internal;
            alias /var/lib/zhishu/media/;
            add_header Cache-Control "private, no-store";
        }

        location ~ ^/api/(?:knowledge-bases/\d+/chat/stream/|applications/\d+/preview/chat/stream/|public/applications/[^/]+/chat/stream/) {
            access_log off;
            proxy_pass http://django_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Request-ID $upstream_request_id;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 150s;
            proxy_send_timeout 150s;
            add_header X-Accel-Buffering no;
        }

        location ~ ^/api/(?:invitations/[^/]+/|public/applications/[^/]+/) {
            access_log off;
            proxy_pass http://django_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Request-ID $upstream_request_id;
            proxy_read_timeout 60s;
        }

        location /api/ {
            proxy_pass http://django_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Request-ID $upstream_request_id;
            proxy_connect_timeout 3s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /health/ {
            access_log off;
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $upstream_request_id;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }

        location = /index.html {
            add_header Cache-Control "no-store";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
