# Include these directives in the server block when Nginx itself terminates TLS.
# Certificate files are deployment secrets and are never copied into this repository.
listen 443 ssl http2;
ssl_certificate /run/secrets/tls_certificate;
ssl_certificate_key /run/secrets/tls_private_key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_timeout 1d;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
